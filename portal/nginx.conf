# 바이트론 업무 포털 — 컨테이너 안 nginx
#
# 🔑 백엔드를 새로 만들지 않는다. 기존 두 앱의 API 로 넘겨주기만 한다.
#    이렇게 하면 브라우저 입장에서 «한 출처» 라 CORS 도 쿠키 문제도 생기지 않는다.
#    곧바로 :8082 를 부르면 다른 포트라 CORS 를 열어야 하고,
#    그건 운영 중인 두 앱을 건드리는 일이다.
#
# ⚠ 두 백엔드는 «포트를 바깥에 열지 않는다»(3001·3002 는 컨테이너 안에서만 보인다).
#   그래서 호스트 IP 로는 닿지 않는다 — 포털 컨테이너를 두 스택의 네트워크에
#   함께 붙여 두고(compose 의 networks 참고) «컨테이너 이름» 으로 부른다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 화면 파일은 캐시하지 않는다 — 고친 것이 사람 화면에 도달하지 않는 사고를
    # 이미 한 번 겪었다(대시보드 2026-08-06).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ── 업무 현황 대시보드 API ──
    # ⏳ 지금은 «테스트» 백엔드를 본다 (2026-08-26). 아직 운영에 휴가·구매 API 가
    #    없어서이기도 하고, 포털을 시험하려면 시험 자료가 보여야 하기 때문이다.
    # 🔴 운영 배포 때 아래 한 줄을 vitron-dashboard-backend-1 로 되돌린다.
    #    화면 맨 위 빨간 띠가 «테스트를 보고 있다» 고 알려 주므로 잊어도 드러난다.
    location /api/dash/ {
        proxy_pass http://vitron-dashboard-test-backend-1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 로그인 쿠키가 그대로 실려 가야 한다. 이게 없으면 늘 「로그인하지 않음」이 된다.
        proxy_pass_request_headers on;
    }

    # ── KPI 추적 시스템 API ──
    location /api/kpi/ {
        proxy_pass http://vitron-kpi-backend-1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # 「로그인하러 가기」 처럼 바깥으로 보내는 자리. 주소가 바뀌면 여기만 고친다.
    location = /go/dashboard { return 302 http://vitron-nas:8082/; }
    location = /go/kpi       { return 302 http://vitron-nas:8083/; }

    # ⚠ 백엔드 오류를 그대로 흘리면 화면이 HTML 을 JSON 으로 읽다 깨진다.
    #   대시보드에서 겪은 그 사고(Unexpected token '<')를 여기서도 막는다.
    error_page 502 503 504 /gateway-error.json;
    location = /gateway-error.json {
        internal;
        default_type application/json;
        return 500 '{"error":"뒤쪽 서버가 응답하지 않습니다. 잠시 뒤 다시 시도해 주십시오."}';
    }
}
