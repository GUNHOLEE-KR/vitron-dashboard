# 바이트론 업무 포털을 http://vitron-nas/ERP 로 여는 설정 — «정본은 이 파일이다»
#
# 놓을 자리
#   /etc/nginx/openmediavault-webgui.d/zz-vitron-erp.conf
#
# 왜 그 자리인가
#   OMV 의 사이트 설정(/etc/nginx/sites-available/openmediavault-webgui)이 마지막 줄에서
#       include /etc/nginx/openmediavault-webgui.d/*.conf;
#   를 부른다. OMV 가 공식적으로 열어 둔 확장 자리이고, 플러그인들도 이 자리를 쓴다.
#
# 🔑 OMV 가 설정을 다시 만들어도 «살아남는다».
#    salt 정의(/srv/salt/omv/deploy/nginx/10webgui.sls)가 그 폴더에서
#    headers.conf · security.conf 두 파일만 «이름으로» 관리하고(file.managed),
#    폴더를 통째로 지우지 않는다(clean 옵션 없음). 2026-08-26 확인.
#
# 넣는 법
#   scp portal/omv-erp.conf root@vitron-nas:/etc/nginx/openmediavault-webgui.d/zz-vitron-erp.conf
#   ssh root@vitron-nas "nginx -t && systemctl reload nginx"
#   ⚠ 반드시 nginx -t 로 «먼저» 검사한다. 이 설정이 깨지면 NAS 관리 화면까지 함께 죽는다.
#
# 되돌리는 법 — 파일만 지우고 다시 reload 하면 원래대로다.
#   ssh root@vitron-nas "rm /etc/nginx/openmediavault-webgui.d/zz-vitron-erp.conf && nginx -t && systemctl reload nginx"

# 뒤에 «/» 가 없으면 상대 경로가 /ERP 가 아니라 / 를 기준으로 풀려 API 를 못 찾는다.
location = /ERP { return 301 /ERP/; }

location /ERP/ {
    proxy_pass http://127.0.0.1:8085/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ⚠ OMV 가 사이트 전체에 붙이는 Content-Security-Policy 는 script-src 'self' 라
    #   우리 화면의 «쪽 안에 적은» 스크립트를 막는다. 이 자리에서만 다시 정한다.
    #   ('unsafe-inline' 을 여는 범위가 /ERP/ 안으로 한정된다)
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
}
