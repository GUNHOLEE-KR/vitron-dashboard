# 바이트론 의견 접수 — NAS 배포용
#
# 🔑 대시보드·KPI·포털과 «별개 스택» 이다. 포털과 같은 이유다 — 이것을 손볼 때마다
#    운영 중인 앱들이 함께 재배포되면 안 된다.
#
# 🔑 다른 스택의 네트워크를 빌리지 않는다. 이 서비스는 DB 도 다른 백엔드도 부르지
#    않고, 바깥으로 메일만 보낸다. 붙일 이유가 없으면 붙이지 않는다.
services:
  feedback:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitron-feedback:latest
    # 8086 — 8085(포털) 다음으로 비어 있는 번호.
    # ⚠ 이 포트는 «브라우저가 직접» 부른다. 대시보드·KPI·RTDB 의 화면에서
    #   widget.js 를 내려받고 접수 API 를 부르므로 바깥에 열려 있어야 한다.
    ports:
      - "8086:3003"
    env_file:
      - .env
    restart: unless-stopped
