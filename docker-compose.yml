# NAS(vitron-nas) 운영 배포용. 갱신은 ./deploy.sh 하나로 끝난다.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: vitron-frontend:latest
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: vitron-backend:latest
    env_file: .env
    restart: unless-stopped
    # 포트는 외부 노출 불필요 — nginx가 내부에서 직접 접근
