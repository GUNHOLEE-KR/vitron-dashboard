server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* 요청은 백엔드 컨테이너로 프록시
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Jira 동기화처럼 오래 걸리는 작업이 기본값 60초에 끊기지 않도록 연장
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 🔴 올리는 파일 크기 상한. 이 줄이 «없으면» nginx 기본값이 1MB 라
        #    휴대폰으로 찍은 영수증(보통 2~5MB)이 413 으로 잘린다.
        #    하이패스 엑셀은 16KB 라 여태 걸린 적이 없었을 뿐이다 (2026-09-24 확인).
        # ⚠ 백엔드(express.json)는 이미 12mb 라 여기만 맞추면 된다.
        #   두 값이 어긋나면 «nginx 는 통과시켰는데 백엔드가 거절하는» 쪽이 되어
        #   오류 문구가 엉뚱해진다.
        client_max_body_size 12m;

        # 백엔드가 죽거나 응답이 없을 때 nginx 가 HTML 오류 페이지를 돌려주면
        # 프론트의 JSON.parse 가 실패해 원인 불명 오류로 보인다. JSON 으로 바꿔준다.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"백엔드 서버가 응답하지 않습니다. 관리자에게 문의하거나 잠시 후 다시 시도해 주세요."}';
    }

    # 해시가 붙은 정적 파일(index-CpLy6pCZ.js 등)은 내용이 바뀌면 이름도 바뀐다.
    # 따라서 영구 캐시해도 안전하고, 재방문 로딩이 빨라진다.
    # expires 지시어를 함께 쓰면 Cache-Control 이 두 번 내려가 immutable 이
    # 무시될 수 있으므로 add_header 하나만 쓴다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React SPA — 모든 경로를 index.html로
    #
    # ⚠️ index.html 은 절대 캐시하면 안 된다.
    # 이 파일이 캐시되면 브라우저가 옛 JS 파일명을 계속 참조해서,
    # 배포를 해도 사용자는 이전 화면을 보게 된다. 실제로 겪은 사고다 —
    # 구버전 화면이 worker_id 를 보내지 않아 저장이 실패했고,
    # 원인을 찾기 전까지 사용자가 강제 새로고침(Ctrl+Shift+R)을 해야 했다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
