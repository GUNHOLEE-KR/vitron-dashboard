server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* 요청은 백엔드 컨테이너로 프록시
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Jira 동기화처럼 오래 걸리는 작업이 기본값 60초에 끊기지 않도록 연장
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 백엔드가 죽거나 응답이 없을 때 nginx 가 HTML 오류 페이지를 돌려주면
        # 프론트의 JSON.parse 가 실패해 원인 불명 오류로 보인다. JSON 으로 바꿔준다.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"백엔드 서버가 응답하지 않습니다. 관리자에게 문의하거나 잠시 후 다시 시도해 주세요."}';
    }

    # React SPA — 모든 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
